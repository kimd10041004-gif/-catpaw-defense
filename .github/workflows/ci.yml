name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 단위 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 의존성이 0개라 npm install이 필요 없다 (node 내장 테스트 러너만 쓴다)
      - name: node --test
        run: npm test

      # U — 사이트가 APK 를 직접 주는 길(tools/fetch-apk.mjs)을 **실제 릴리스 API 상대로** 돌려 본다.
      # 단위 검사는 fetch 를 가짜로 바꿔 논리만 보고, 개발 세션의 프록시는 api.github.com 을 막는다 —
      # 그래서 이 스크립트의 네트워크 경로를 증명하는 곳은 여기뿐이다(pages.yml 은 main 에서만 돈다).
      # push 에서만 돈다: 포크의 pull_request 토큰은 남의 저장소라 뜻이 없고, 같은 저장소 브랜치는 push 가 이미 돈다.
      # `dev` 릴리스가 없으면 빨갛다 — release.yml 을 한 번 돌리면 생긴다(사이트도 그 릴리스 없이는 못 올라간다).
      - name: fetch-apk 리허설 (dev 릴리스에서 실제로 받는다)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for i in 1 2 3; do
            if node tools/fetch-apk.mjs; then break; fi
            [ "$i" = 3 ] && { echo "dev 릴리스에서 APK 를 못 받았다 — 사이트 배포도 같은 이유로 멈출 것이다"; exit 1; }
            echo "받기 실패 ($i/3) — release.yml 이 dev 를 다시 만드는 중일 수 있다. 15초 뒤 재시도"
            sleep 15
          done
          ls -l site/catpaw-defense-latest.apk

  android:
    name: 안드로이드 APK 빌드
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # U — 'tools'(옛 SDK Tools) 패키지가 Google 저장소에서 사라져 setup-android 의 기본값(tools platform-tools)이
      # 2026-09-14 부터 sdkmanager 에서 exit 1 로 죽는다. 우리 빌드에 그 패키지는 필요 없다 — platform-tools 만 받는다.
      - name: 안드로이드 SDK 설치
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: gradlew 실행 권한
        run: chmod +x android/gradlew

      - name: 디버그 APK 빌드
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      # 이 아티팩트를 내려받아 폰에 설치하면 된다 (디버그 키로 서명돼 바로 설치 가능)
      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: catpaw-defense-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 릴리스 AAB. 저장소 비밀(CATPAW_KEYSTORE_B64 · CATPAW_KEYSTORE_PW · CATPAW_KEY_ALIAS · CATPAW_KEY_PW)이
      # 있으면 그 키로, 없으면 디버그 키로 서명한다 — 디버그 키 AAB 는 Play 가 거부하므로 빌드 검증용이다.
      - name: 릴리스 키스토어 (비밀이 있을 때만)
        env:
          KEYSTORE_B64: ${{ secrets.CATPAW_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/catpaw.keystore"
            echo "CATPAW_KEYSTORE=$RUNNER_TEMP/catpaw.keystore" >> "$GITHUB_ENV"
            echo "릴리스 키로 서명한다"
          else
            echo "키스토어 비밀이 없다 — 디버그 키로 서명한 AAB 를 만든다 (Play 업로드 불가, 빌드 검증용)"
          fi

      # AAB 는 Play 용, APK 는 폰에 바로 깔아 보는 용. 한 번에 만들어야 R8 을 두 번 안 돌린다.
      - name: 릴리스 빌드 (R8 · 리소스 축소) — AAB + APK
        working-directory: android
        env:
          CATPAW_KEYSTORE_PW: ${{ secrets.CATPAW_KEYSTORE_PW }}
          CATPAW_KEY_ALIAS: ${{ secrets.CATPAW_KEY_ALIAS }}
          CATPAW_KEY_PW: ${{ secrets.CATPAW_KEY_PW }}
        run: ./gradlew --no-daemon --stacktrace bundleRelease assembleRelease

      - name: AAB 업로드
        uses: actions/upload-artifact@v4
        with:
          name: catpaw-defense-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      # R8 이 뭘 잘못 지웠는지는 기기에서 돌려야만 드러난다 — 디버그 APK 로는 못 잡는다.
      # 한 번 탭해서 받는 쪽은 Release 자산이다(.github/workflows/release.yml).
      - name: 릴리스 APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: catpaw-defense-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
