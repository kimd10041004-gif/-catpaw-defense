name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 단위 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 의존성이 0개라 npm install이 필요 없다 (node 내장 테스트 러너만 쓴다)
      - name: node --test
        run: npm test

  android:
    name: 안드로이드 APK 빌드
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 안드로이드 SDK 설치
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: gradlew 실행 권한
        run: chmod +x android/gradlew

      - name: 디버그 APK 빌드
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      # 이 아티팩트를 내려받아 폰에 설치하면 된다 (디버그 키로 서명돼 바로 설치 가능)
      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: catpaw-defense-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 릴리스 AAB. 저장소 비밀(CATPAW_KEYSTORE_B64 · CATPAW_KEYSTORE_PW · CATPAW_KEY_ALIAS · CATPAW_KEY_PW)이
      # 있으면 그 키로, 없으면 디버그 키로 서명한다 — 디버그 키 AAB 는 Play 가 거부하므로 빌드 검증용이다.
      - name: 릴리스 키스토어 (비밀이 있을 때만)
        env:
          KEYSTORE_B64: ${{ secrets.CATPAW_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/catpaw.keystore"
            echo "CATPAW_KEYSTORE=$RUNNER_TEMP/catpaw.keystore" >> "$GITHUB_ENV"
            echo "릴리스 키로 서명한다"
          else
            echo "키스토어 비밀이 없다 — 디버그 키로 서명한 AAB 를 만든다 (Play 업로드 불가, 빌드 검증용)"
          fi

      # AAB 는 Play 용, APK 는 폰에 바로 깔아 보는 용. 한 번에 만들어야 R8 을 두 번 안 돌린다.
      - name: 릴리스 빌드 (R8 · 리소스 축소) — AAB + APK
        working-directory: android
        env:
          CATPAW_KEYSTORE_PW: ${{ secrets.CATPAW_KEYSTORE_PW }}
          CATPAW_KEY_ALIAS: ${{ secrets.CATPAW_KEY_ALIAS }}
          CATPAW_KEY_PW: ${{ secrets.CATPAW_KEY_PW }}
        run: ./gradlew --no-daemon --stacktrace bundleRelease assembleRelease

      - name: AAB 업로드
        uses: actions/upload-artifact@v4
        with:
          name: catpaw-defense-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      # R8 이 뭘 잘못 지웠는지는 기기에서 돌려야만 드러난다 — 디버그 APK 로는 못 잡는다.
      # 한 번 탭해서 받는 쪽은 Release 자산이다(.github/workflows/release.yml).
      - name: 릴리스 APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: catpaw-defense-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
