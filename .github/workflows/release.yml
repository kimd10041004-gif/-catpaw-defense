name: 릴리스 (설치용 APK)

# 폰에 깔 수 있는 APK 를 Release 자산으로 올린다.
#
# 왜 따로 있나: CI 의 Actions 아티팩트는 ZIP 으로 감싸이고 로그인해야 받을 수 있어서 폰에서 쓰기 나쁘다.
# Release 자산은 브라우저에서 한 번 탭하면 바로 받아진다.
#
#   Actions → '릴리스 (설치용 APK)' → Run workflow (main)        → 태그 `dev` 프리릴리스를 새로 만든다(주소가 늘 같다)
#   Actions → '릴리스 (설치용 APK)' → Run workflow (다른 브랜치) → 태그 `preview` 프리릴리스 — 사이트와 무관하다
#   git tag v1.0.1 && git push --tags                            → 그 태그로 진짜 릴리스를 만든다
#
# Y — **`dev` 는 main 에서만 만든다.** 공식 사이트(pages.yml)는 이 워크플로가 끝나면 `dev` 의 APK 를 받아
# **main 의 문구**와 함께 다시 올린다. 브랜치 빌드가 `dev` 에 들어가면 사이트 문구와 APK 가 어긋난다 — PR #5 의
# APK(결제 라이브러리 때문에 INTERNET 권한이 있다)가 main 의 "인터넷 권한 없음" 밑에 올라갈 뻔했다.
#
# 키스토어 비밀(CATPAW_KEYSTORE_B64 등)이 없으면 사이트판 APK 도 디버그 키로 서명된다
# (build.gradle.kts 의 폴백). 옆에서 깔기엔 문제없고 Play 는 이 키를 거부하므로 사고로 올라갈 일은 없다.
#
# W — 여기서 올리는 APK 는 **Play 판과 다른 앱**(`com.catpaw.defense.sideload`, 이름 '캣포 디펜스 (사이트)')이다.
# 전에는 `com.catpaw.defense` 를 그대로 올렸는데, Play 판과 서명이 달라 서로 덮어 깔리지 않았다 — 사이트판을 깐
# 사람은 Play 판을 깔려면 지우고 진행도를 잃어야 했다. 이제 둘이 나란히 깔린다. Play 용 AAB 는 CI(ci.yml)가 만든다.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # gh release create 에 필요하다

jobs:
  apk:
    name: APK 빌드 · 릴리스 올리기
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 깨진 빌드를 폰에 올리지 않는다
      - name: node --test
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # U — 'tools'(옛 SDK Tools) 패키지가 Google 저장소에서 사라져 setup-android 의 기본값(tools platform-tools)이
      # 2026-09-14 부터 sdkmanager 에서 exit 1 로 죽는다. 우리 빌드에 그 패키지는 필요 없다 — platform-tools 만 받는다.
      - name: 안드로이드 SDK 설치
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: gradlew 실행 권한
        run: chmod +x android/gradlew

      - name: 릴리스 키스토어 (비밀이 있을 때만)
        env:
          KEYSTORE_B64: ${{ secrets.CATPAW_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/catpaw.keystore"
            echo "CATPAW_KEYSTORE=$RUNNER_TEMP/catpaw.keystore" >> "$GITHUB_ENV"
            echo "SIGNED_BY=릴리스 키" >> "$GITHUB_ENV"
          else
            echo "SIGNED_BY=디버그 키 (Play 업로드 불가 · 옆에서 깔기는 가능)" >> "$GITHUB_ENV"
          fi

      - name: APK 두 개 빌드 (디버그 · R8 사이트판)
        working-directory: android
        env:
          CATPAW_KEYSTORE_PW: ${{ secrets.CATPAW_KEYSTORE_PW }}
          CATPAW_KEY_ALIAS: ${{ secrets.CATPAW_KEY_ALIAS }}
          CATPAW_KEY_PW: ${{ secrets.CATPAW_KEY_PW }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleSideload

      # 버전과 종류가 파일 이름에 보여야 폰의 다운로드 폴더에서 헷갈리지 않는다
      - name: 이름 붙이기
        id: pack
        run: |
          set -eu
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/catpaw-defense-${VERSION}-debug.apk"
          cp android/app/build/outputs/apk/sideload/app-sideload.apk \
             "out/catpaw-defense-${VERSION}-site.apk"
          # 버전이 안 박힌 별칭. 공식 사이트(site/index.html)가 이 고정 주소를 걸어서,
          # 버전을 올려도 다운로드 링크가 안 죽는다.
          cp android/app/build/outputs/apk/sideload/app-sideload.apk \
             "out/catpaw-defense-latest.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh out

      # 태그 푸시: 그 태그로 진짜 릴리스.
      # main 에서 Run workflow: 태그 `dev` 를 지웠다 다시 만든다 → 내려받는 주소가 늘 같고, 사이트가 이걸 준다.
      # 다른 브랜치에서 Run workflow: 태그 `preview` 를 같은 식으로 — 사이트는 안 읽는다(머리말 Y).
      - name: Release 에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pack.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          HEAD_NOTE=""
          LATEST_ROW="| \`catpaw-defense-latest.apk\` | \`com.catpaw.defense.sideload\` | 사이트판과 같은 파일. 공식 사이트가 거는 고정 주소입니다 |"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            TITLE="캣포 디펜스 $TAG"
            FLAGS=""
          else
            # 기본 브랜치를 못 읽으면(빈 값) preview 로 간다 — 사이트가 받는 dev 를 잘못 덮는 쪽보다 낫다
            if [ -n "$DEFAULT_BRANCH" ] && [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
              TAG="dev"
              TITLE="개발 빌드 v$VERSION"
            else
              TAG="preview"
              TITLE="미리보기 빌드 v$VERSION ($GITHUB_REF_NAME)"
              HEAD_NOTE="**미리보기** — \`$GITHUB_REF_NAME\` 브랜치의 빌드입니다. 공식 사이트가 주는 파일(\`dev\`)이 아닙니다."
              # 사이트가 안 읽는 태그라 고정 주소 별칭은 올리지 않는다 — 있으면 '사이트 파일'로 오해한다
              rm -f out/catpaw-defense-latest.apk
              LATEST_ROW=""
            fi
            FLAGS="--prerelease"
            # 같은 태그를 다시 쓰므로 먼저 지운다 (없으면 조용히 넘어간다)
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          fi

          NOTES=$(cat <<EOF
          $HEAD_NOTE

          커밋 \`${GITHUB_SHA:0:7}\` 로 만든 설치용 APK. 서명: $SIGNED_BY

          | 파일 | 패키지 | 쓸 곳 |
          |---|---|---|
          | \`catpaw-defense-$VERSION-site.apk\` | \`com.catpaw.defense.sideload\` | **이걸 먼저 깔아 보세요.** 릴리스와 같은 R8·리소스 축소 빌드라 R8 이 뭘 잘못 지웠는지 이걸로 드러납니다. Play 판과 **다른 앱**이라 나란히 깔립니다(홈 화면 이름 '캣포 디펜스 (사이트)'). 결제는 Play 판에서만 됩니다 |
          | \`catpaw-defense-$VERSION-debug.apk\` | \`com.catpaw.defense.debug\` | 디버그. 사이트판·Play 판과 **나란히** 깔리고 세이브도 따로입니다 |
          $LATEST_ROW

          설치 방법과 확인할 것: [docs/실기기설치.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/실기기설치.md)
          EOF
          )

          # 태그가 없으면 gh 는 기본 브랜치(main)의 끝에 태그를 만든다 — PR 브랜치에서 돌리면 태그와 APK 가
          # 다른 커밋을 가리키고, 릴리스의 'Source code' 도 main 의 것이 된다. 빌드한 커밋에 붙인다(태그 푸시면 무시된다).
          gh release create "$TAG" out/*.apk \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "$NOTES" \
            $FLAGS

          echo "받는 곳: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
