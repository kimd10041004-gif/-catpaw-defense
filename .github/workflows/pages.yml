name: 공식 사이트 (GitHub Pages)

# **지금 주 호스팅은 Vercel 이다** (저장소 루트의 `vercel.json`). 이 워크플로는 예비로 남겨 둔 것이라
# **자동으로 안 돈다** — Actions 에서 손으로 실행할 때만 돈다.
#
# 왜 옮겼나: Pages 사이트 생성은 admin 권한이라 GITHUB_TOKEN 으로 못 켠다.
#   configure-pages          → `Get Pages site failed ... Not Found`
#   enablement: true 로 시도  → `Resource not accessible by integration`
# 그래서 "Settings → Pages → Source = GitHub Actions" 를 사람이 눌러야 하는데, 그게 세 번 막혔다.
# 게다가 저장소를 Private 으로 바꾸면 Pages 는 GitHub Pro 가 필요해져 어차피 끊긴다 — Vercel 은 안 그렇다.
#
# 자동 실행을 끈 이유: 안 켜진 Pages 로 배포를 시도하면 `site/**`·`web/**` 를 고칠 때마다 빨갛게 실패한다.
# 되살리려면 Settings 에서 Source 를 GitHub Actions 로 바꾸고 `on:` 에 push 를 도로 넣으면 된다.
#
# site/ 만 올린다. 게임 자체(web/)의 전체판은 안 올린다 — 데모 결제라 유료 콘텐츠까지 공짜로 열린다.
# 브라우저판(site/play/)은 유료 콘텐츠를 뺀 데모 빌드다(tools/demo-build.mjs).
#
# 주소: https://kimd10041004-gif.github.io/-catpaw-defense/
#
# 스크린샷(site/img/)은 `node tools/site-build.mjs` 가 store/ 에서 구워 커밋해 둔 것을 그대로 쓴다.
# 여기서 다시 굽지 않는다 — Playwright 를 CI 에 들이지 않으려고.
#
# 데모 웹 빌드(site/play/)는 **여기서 굽는다** — web/ 을 그대로 복사한 것이라 커밋하면 저장소가 두 배가 된다.
# demo-build.mjs 는 파일 복사뿐이라 Playwright 가 필요 없다. 유료 콘텐츠가 안 섞였는지는 demo.test 가 본다.

on:
  workflow_dispatch:   # 손으로만. push 트리거는 위 머리말의 이유로 뺐다.

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 것을 취소하지는 않는다(반쯤 올라간 사이트를 만들지 않게).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 사이트 배포
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 사이트가 참조하는 그림이 실제로 있는지, 버전이 맞는지, 데모에 유료 콘텐츠가 안 섞였는지.
      # 데모 검사가 먼저 빨개지면 배포가 멈춘다 — 파는 물건을 실수로 올리는 것보다 안 올리는 게 낫다.
      - name: 사이트·데모 검사
        run: node --test tests/node/site.test.mjs tests/node/demo.test.mjs

      # 데모 웹 빌드 → site/play/ (아이폰은 이것만 할 수 있다)
      - name: 데모 빌드
        run: node tools/demo-build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
