name: 공식 사이트 (GitHub Pages)

# site/ 를 GitHub Pages 로 올린다. 게임 자체(web/)는 안 올린다 —
# 지금 웹 빌드는 '데모 결제'라 유료 콘텐츠까지 공짜로 열리기 때문이다(README 과금 절).
#
# **사람이 한 번 해야 한다**: 저장소 Settings → Pages → Build and deployment → Source = "GitHub Actions".
# 그 전에는 마지막 단계에서 죽는다: `Get Pages site failed ... Not Found`.
#
# 워크플로가 알아서 켜게 해 보려고 `configure-pages` 의 `enablement: true` 를 넣어 돌렸더니
# `Resource not accessible by integration` 이었다 — Pages 사이트 생성은 admin 권한이라 GITHUB_TOKEN 으로는
# 안 된다(`permissions: pages: write` 로도). 그래서 도로 뺐다. 안 되는 걸 켜 두면 에러 문구만 헷갈려진다.
#
# 주소: https://kimd10041004-gif.github.io/-catpaw-defense/
#
# 스크린샷(site/img/)은 `node tools/site-build.mjs` 가 store/ 에서 구워 커밋해 둔 것을 그대로 쓴다.
# 여기서 다시 굽지 않는다 — Playwright 를 CI 에 들이지 않으려고.
#
# 데모 웹 빌드(site/play/)는 **여기서 굽는다** — web/ 을 그대로 복사한 것이라 커밋하면 저장소가 두 배가 된다.
# demo-build.mjs 는 파일 복사뿐이라 Playwright 가 필요 없다. 유료 콘텐츠가 안 섞였는지는 demo.test 가 본다.

on:
  push:
    branches: [main]
    # web/** 도 본다 — 데모 빌드가 web/ 에서 나오므로 게임을 고치면 사이트의 /play/ 도 낡는다
    paths: ['site/**', 'web/**', 'tools/demo-build.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 것을 취소하지는 않는다(반쯤 올라간 사이트를 만들지 않게).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 사이트 배포
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 사이트가 참조하는 그림이 실제로 있는지, 버전이 맞는지, 데모에 유료 콘텐츠가 안 섞였는지.
      # 데모 검사가 먼저 빨개지면 배포가 멈춘다 — 파는 물건을 실수로 올리는 것보다 안 올리는 게 낫다.
      - name: 사이트·데모 검사
        run: node --test tests/node/site.test.mjs tests/node/demo.test.mjs

      # 데모 웹 빌드 → site/play/ (아이폰은 이것만 할 수 있다)
      - name: 데모 빌드
        run: node tools/demo-build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
