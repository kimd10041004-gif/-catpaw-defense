name: 공식 사이트 (gh-pages)

# site/ 를 GitHub Pages 로 올린다. **gh-pages 브랜치에 밀어서** 올린다.
#
# 왜 이 방식인가 — 처음엔 actions/deploy-pages 로 하려 했는데 못 켰다:
#   configure-pages                    → Get Pages site failed ... Not Found
#   configure-pages(enablement: true)  → Resource not accessible by integration
# Pages **사이트 생성**은 admin 권한이라 GITHUB_TOKEN 으로 안 된다. 그래서 사람이
# Settings → Pages → Source 를 바꿔야 하는데 그게 여러 번 막혔다(모바일 앱에는 그 설정이 없고,
# 로그아웃 상태면 설정 페이지가 404 로 보인다).
#
# 그런데 GitHub 은 `gh-pages` 브랜치가 올라오면 Pages 를 **자동으로 켠다** — 설정 API 를 안 지난다.
# 실제로 그렇게 켜졌다: `dynamic/pages/pages-build-deployment` 실행이 gh-pages 에서 성공했다.
# 그래서 이 워크플로가 하는 일은 하나다 — 구운 site/ 를 gh-pages 에 통째로 덮어쓰는 것.
#
# 주소: https://kimd10041004-gif.github.io/-catpaw-defense/
#       https://kimd10041004-gif.github.io/-catpaw-defense/play/   ← 아이폰은 이것뿐이다
#
# 게임 전체판(web/)은 안 올린다 — 웹의 데모 결제라 유료 콘텐츠까지 공짜로 열린다.
# 올라가는 것은 유료 콘텐츠를 뺀 데모 빌드다(tools/demo-build.mjs · docs/아이폰.md).
#
# 저장소를 Private 으로 바꾸면 Pages 는 GitHub Pro 가 필요해 끊긴다. 그때는 Vercel 로 간다 —
# 루트의 `vercel.json` 이 그 준비다(같은 검사·같은 빌드 명령을 쓴다).

on:
  push:
    branches: [main]
    # web/** 도 본다 — 데모 빌드가 web/ 에서 나오므로 게임을 고치면 /play/ 도 낡는다
    paths: ['site/**', 'web/**', 'tools/demo-build.mjs', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write   # gh-pages 브랜치에 푸시한다

# 배포는 한 번에 하나만. 진행 중인 것을 취소하지 않는다(반쯤 올라간 사이트를 만들지 않게).
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 사이트 배포
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 참조한 그림이 있는지, 버전이 맞는지, 데모에 유료 콘텐츠가 안 섞였는지.
      # 여기서 빨개지면 배포가 멈춘다 — 파는 물건을 실수로 올리는 것보다 안 올리는 게 낫다.
      - name: 사이트·데모 검사
        run: node --test tests/node/site.test.mjs tests/node/demo.test.mjs

      # site/play/ 는 .gitignore 라 저장소에 없다. 여기서 굽는다.
      - name: 데모 빌드
        run: node tools/demo-build.mjs

      # gh-pages 는 산출물 브랜치라 이력을 쌓지 않는다 — 매번 커밋 하나로 덮어쓴다
      # (8.5MB 짜리라 이력을 쌓으면 저장소가 계속 커진다). site/ 안에서 새 저장소를 만들어 밀면
      # 체크아웃한 main 을 건드리지 않는다.
      - name: gh-pages 로 밀기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test -f site/play/index.html || { echo "site/play/ 가 없다 — 데모 빌드가 안 돌았다"; exit 1; }
          touch site/.nojekyll
          cd site
          git init -q
          git checkout -qb gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # 루트 .gitignore 는 site/play/ 를 무시한다. 여기 새로 만든 저장소의 루트는 site/ 라
          # 그 규칙이 안 닿지만, 닿게 되면 **아이폰 경로만 조용히 빠진 사이트**가 올라간다.
          # 그러느니 배포를 멈춘다.
          git ls-files --error-unmatch play/index.html >/dev/null \
            || { echo "play/ 가 커밋에 안 들어갔다 — .gitignore 가 닿았다"; exit 1; }
          git commit -q -m "사이트 배포: ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "밀었다 · 파일 $(git ls-files | wc -l)개 (기대: 119 안팎)"
